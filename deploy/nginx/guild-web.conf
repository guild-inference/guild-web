# Optional static-origin template. Install only after production authorization.
# Deploy package-site outputs into /var/www/<target>/.
# TLS must cover guild.illatio.dev AND docs.guild.illatio.dev AND models.guild.illatio.dev.
# *.illatio.dev alone cannot cover the nested names; see DEPLOYMENT.md.
server {
    listen 127.0.0.1:8084;
    server_name guild.illatio.dev;
    root /var/www/guild;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 127.0.0.1:8084;
    server_name docs.guild.illatio.dev;
    root /var/www/docs;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 127.0.0.1:8084;
    server_name models.guild.illatio.dev;
    root /var/www/models;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
