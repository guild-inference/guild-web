name = "guild-web"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [
  { pattern = "guild.illatio.dev/*", zone_name = "illatio.dev" },
  { pattern = "docs.guild.illatio.dev", custom_domain = true, zone_name = "illatio.dev" },
  { pattern = "models.guild.illatio.dev", custom_domain = true, zone_name = "illatio.dev" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true
